<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="カードをめくって同じ絵柄をそろえる神経衰弱ゲーム"><title>神経衰弱</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><p class="badge">MEMORY GAME</p><h1>神経衰弱</h1><p>カードをめくり、同じ絵柄のペアをすべて見つけよう。</p></div><a class="home" href="https://kentaro0810.github.io/secret-links/">リンク集へ戻る</a></header><section class="panel setup"><div><label for="difficulty">難易度</label><select id="difficulty"><option value="easy">かんたん 4×3</option><option value="normal" selected>ふつう 4×4</option><option value="hard">むずかしい 6×4</option></select></div><button id="newGame" class="primary">新しいゲーム</button></section><section class="stats"><article><span>時間</span><strong id="time">00:00</strong></article><article><span>めくった回数</span><strong id="moves">0</strong></article><article><span>ペア</span><strong><span id="pairs">0</span>/<span id="totalPairs">8</span></strong></article><article><span>最高記録</span><strong id="best">--</strong></article></section><section class="game-shell"><div id="message" class="message">カードを1枚選んでスタート</div><div id="board" class="board" aria-label="神経衰弱のカード"></div></section><section class="howto"><h2>遊び方</h2><ol><li>カードを2枚めくります。</li><li>同じ絵柄ならペアとして残ります。</li><li>すべてのペアを、できるだけ少ない回数と短い時間でそろえます。</li></ol><p>最高記録は、このブラウザーに保存されます。</p></section><dialog id="resultDialog"><div class="result"><p class="badge blue">CLEAR!</p><h2>全ペア完成！</h2><p id="resultText"></p><p id="recordText" class="record"></p><div class="dialog-actions"><button id="playAgain" class="primary">もう一度遊ぶ</button><button id="closeDialog" class="secondary">閉じる</button></div></div></dialog></main><script src="script.js"></script></body></html>
